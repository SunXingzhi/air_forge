name: simulator-build

on:
  push:
    branches: [main]
    paths:
      - "sim/**"
      - "ui/**"
      - "scripts/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "sim/**"
      - "ui/**"
      - "scripts/**"
      - ".github/workflows/**"

jobs:
  linux:
    name: Linux (GCC + SDL2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libsdl2-dev

      - name: Fetch LVGL
        run: python3 scripts/fetch_deps.py --lvgl-only

      - name: Configure
        run: >
          cmake -S sim -B sim/build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build sim/build -j"$(nproc)"
